<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>HUGO JUIZ 5.1 - Eisenhower Edition</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <input type="file" id="json-import-input" accept=".json" style="display: none;" onchange="StudySystem.handleFileImport(this)">

    <header class="header">
        <div class="header-content">
            <div class="logo">
                <i class="fas fa-chess-king"></i>
                <div>
                    <h1>HUGO JUIZ 5.1</h1>
                    <span class="subtitle">Estratégia & Matriz Tática</span>
                </div>
            </div>
            <div class="header-actions">
                <button class="btn btn-outline" onclick="StudySystem.exportData()" title="Backup">
                    <i class="fas fa-download"></i>
                </button>
                <button class="btn btn-outline" onclick="document.getElementById('json-import-input').click()" title="Restaurar">
                    <i class="fas fa-upload"></i>
                </button>
                <button class="btn btn-secondary btn-small" onclick="toggleDarkMode()">
                    <i class="fas fa-adjust"></i>
                </button>
            </div>
        </div>
    </header>

    <div class="container">
        <aside>
            <div class="card">
                <div class="card-header">
                    <h3><i class="fas fa-compass"></i> Estratégia</h3>
                </div>
                <div class="form-group">
                    <button class="btn btn-primary w-100" onclick="StudySystem.openAddDisciplineModal()">
                        <i class="fas fa-plus-circle"></i> Nova Disciplina
                    </button>
                </div>
                
                <div class="nav-menu mt-3">
                    <button class="btn btn-menu active" id="btn-view-cards" onclick="StudySystem.switchView('cards')">
                        <i class="fas fa-th-large"></i> Meus Cards
                    </button>
                    <button class="btn btn-menu" id="btn-view-ranking" onclick="StudySystem.switchView('ranking')">
                        <i class="fas fa-list-ol"></i> Ranking Hierárquico
                    </button>
                    <button class="btn btn-menu" id="btn-view-plan" onclick="StudySystem.switchView('plan')">
                        <i class="fas fa-crosshairs"></i> Plano de Ataque
                    </button>
                    <button class="btn btn-menu" id="btn-view-matrix" onclick="StudySystem.switchView('matrix')">
                        <i class="fas fa-border-all"></i> Matriz Eisenhower
                    </button>
                </div>

                <div class="mt-3 pt-3 border-top">
                    <div class="form-group">
                        <label class="d-flex" style="cursor: pointer;">
                            <input type="checkbox" id="show-archived-toggle" onchange="StudySystem.toggleShowArchived(this.checked)">
                            <span class="ml-2"><i class="fas fa-bed"></i> Mostrar Adormecidas</span>
                        </label>
                    </div>
                </div>
            </div>

            <div class="card mt-3">
                <div class="card-header">
                    <h3><i class="fas fa-chart-pie"></i> Aproveitamento</h3>
                </div>
                <div style="text-align: center; padding: 10px;">
                    <h2 id="global-average" style="font-size: 2.5rem;">0%</h2>
                    <small class="text-muted">Média Geral Ponderada</small>
                </div>
            </div>
        </aside>

        <main>
            <div class="search-bar mb-3">
                <input type="text" id="search-input" placeholder="Filtrar por nome, tópico ou peso...">
            </div>

            <div id="main-content-area"></div>
        </main>
    </div>

    <div id="discipline-modal" class="modal">
        <div class="modal-content large-modal">
            <div class="modal-header" id="disc-modal-header"></div>
            <div class="modal-body" id="modal-body"></div>
        </div>
    </div>

    <div id="stats-modal" class="modal" style="z-index: 2100;">
        <div class="modal-content small-modal">
            <div class="modal-header">
                <h3>Registrar Desempenho</h3>
                <button class="btn-icon" onclick="document.getElementById('stats-modal').style.display='none'"><i class="fas fa-times"></i></button>
            </div>
            <div class="modal-body">
                <input type="hidden" id="stats-disc-id">
                <input type="hidden" id="stats-topic-id">
                <div class="form-group">
                    <label>Questões Feitas</label>
                    <input type="number" id="stats-total" placeholder="Ex: 10">
                </div>
                <div class="form-group">
                    <label>Questões Certas</label>
                    <input type="number" id="stats-correct" placeholder="Ex: 8">
                </div>
                <div class="mt-3 text-center">
                    <button class="btn btn-primary w-100" onclick="StudySystem.saveTopicStats()">Salvar Resultado</button>
                </div>
            </div>
        </div>
    </div>

    <div id="add-discipline-modal" class="modal">
        <div class="modal-content small-modal">
            <div class="modal-header">
                <h3>Nova Disciplina</h3>
                <button class="btn-icon" onclick="document.getElementById('add-discipline-modal').style.display='none'"><i class="fas fa-times"></i></button>
            </div>
            <div class="modal-body">
                <div class="form-group">
                    <label>Nome</label>
                    <input type="text" id="new-disc-name">
                </div>
                <div class="form-group">
                    <label>Peso (1-20)</label>
                    <input type="number" id="new-disc-weight" value="10" min="1" max="20">
                </div>
                <div class="form-group">
                    <label>Cor</label>
                    <input type="color" id="new-disc-color" value="#2563eb" style="width: 100%; height: 40px;">
                </div>
                <button class="btn btn-primary w-100 mt-3" onclick="StudySystem.saveNewDiscipline()">Criar</button>
            </div>
        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>
